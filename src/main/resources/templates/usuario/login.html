<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<header th:replace="~{fragments/layout :: menu}"></header>

<main class="container">
    <div class="caixa caixa-pequena">
        <h1>Entrar</h1>
        <div th:replace="~{fragments/layout :: mensagens}"></div>

        <form th:action="@{/login}" method="post">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" th:value="${email}" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>

            <button type="submit" class="botao">Entrar</button>
        </form>

        <p class="centro">Não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
